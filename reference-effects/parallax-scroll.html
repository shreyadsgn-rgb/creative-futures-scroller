<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Parallax Scroll — Reference Demo</title>
<style>
  /* ============================================
     PARALLAX SCROLL — how it works
     ============================================
     The trick: the background image and the text
     sit in two separate layers. As you scroll,
     JS reads how far down the page you've scrolled
     and moves the background layer at a SLOWER rate
     than the actual scroll speed. That's what creates
     the "background moves slower than foreground" feel.
  ============================================ */

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #0d1b1e; /* placeholder deep teal/near-black, swap for your CSS variables later */
    color: #f4f4f0;
  }

  /* A tall spacer so there's room to actually scroll */
  .spacer {
    height: 60vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    opacity: 0.6;
  }

  /* The parallax section itself: a fixed-height "window"
     with the background layer positioned absolutely
     inside it, taller than the window so it has room
     to slide around without showing empty edges. */
  .parallax-section {
    position: relative;
    height: 70vh;
    overflow: hidden;
  }

  .parallax-bg {
    position: absolute;
    top: -20%;
    left: 0;
    width: 100%;
    height: 140%; /* taller than the section so it can shift without gapping */
    background-image: repeating-linear-gradient(
      135deg,
      #1c3a3f 0px, #1c3a3f 40px,
      #234a50 40px, #234a50 80px
    );
    /* ^ placeholder pattern standing in for your real background image.
       Swap this for: background-image: url('images/your-image.jpg');
       background-size: cover; background-position: center; */
    will-change: transform;
  }

  .parallax-content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }

  .parallax-content h2 {
    font-size: 2.2rem;
    max-width: 30ch;
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
  }
</style>
</head>
<body>

  <div class="spacer">Scroll down ↓</div>

  <section class="parallax-section" id="parallax1">
    <div class="parallax-bg" id="bg1"></div>
    <div class="parallax-content">
      <h2>Background moves slower than this text as you scroll.</h2>
    </div>
  </section>

  <div class="spacer">Keep scrolling ↓</div>

  <section class="parallax-section" id="parallax2">
    <div class="parallax-bg" id="bg2"></div>
    <div class="parallax-content">
      <h2>A second parallax section — same class, reused.</h2>
    </div>
  </section>

  <div class="spacer">End of demo</div>

  <script>
    /* ============================================
       THE REUSABLE PART
       ============================================
       This is the "class describes the behavior" idea
       you asked about earlier — every element with the
       class "parallax-bg" gets this same scroll behavior
       automatically, no matter how many you add to the page.
    ============================================ */

    // Grab every parallax background layer on the page
    const parallaxLayers = document.querySelectorAll('.parallax-bg');

    // How much slower the background should move.
    // 0 = doesn't move at all, 1 = moves at full scroll speed.
    // 0.3–0.5 tends to look like a "parallax" effect without
    // being distracting.
    const PARALLAX_SPEED = 0.4;

    function updateParallax() {
      parallaxLayers.forEach((layer) => {
        const section = layer.parentElement;
        const rect = section.getBoundingClientRect();

        // Only bother calculating if the section is anywhere
        // near the visible screen — cheap optimization so we're
        // not doing math for sections far off screen.
        if (rect.bottom < 0 || rect.top > window.innerHeight) return;

        // How far the section's top is from the top of the
        // viewport tells us how much to shift the background.
        const offset = rect.top * PARALLAX_SPEED;

        layer.style.transform = `translateY(${offset}px)`;
      });
    }

    // requestAnimationFrame keeps this smooth and avoids
    // hammering the browser on every single scroll pixel.
    let ticking = false;
    window.addEventListener('scroll', () => {
      if (!ticking) {
        requestAnimationFrame(() => {
          updateParallax();
          ticking = false;
        });
        ticking = true;
      }
    });

    // Run once on load in case the page loads already scrolled
    updateParallax();
  </script>

</body>
</html>
